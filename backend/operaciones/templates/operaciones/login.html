<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Tu SaaS POS</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .login-box { background: white; padding: 40px; border-radius: 10px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 100%; max-width: 350px; text-align: center; }
        .login-box h1 { margin-top: 0; color: #2c3e50; font-size: 24px; margin-bottom: 5px; }
        .login-box p { color: #7f8c8d; font-size: 14px; margin-bottom: 30px; }
        
        .form-group { margin-bottom: 20px; text-align: left; }
        .form-group label { display: block; font-weight: bold; color: #34495e; margin-bottom: 5px; font-size: 14px; }
        .form-group input { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; font-size: 14px; }
        .form-group input:focus { outline: none; border-color: #3498db; box-shadow: 0 0 5px rgba(52, 152, 219, 0.3); }
        
        .btn-submit { background-color: #3498db; color: white; width: 100%; padding: 12px; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .btn-submit:hover { background-color: #2980b9; }
        
        .error-msj { color: #e74c3c; font-size: 13px; margin-bottom: 15px; background: #fadbd8; padding: 10px; border-radius: 5px; }
    </style>
</head>
<body>

    <div class="login-box">
        <h1>Bienvenido</h1>
        <p>Ingresa tus credenciales para acceder</p>

        {% if form.errors %}
            <div class="error-msj">Usuario o contraseña incorrectos. Intenta de nuevo.</div>
        {% endif %}

        <form method="POST">
            {% csrf_token %}
            <div class="form-group">
                <label>Usuario</label>
                <!-- Renderizamos solo el campo de nombre de usuario de Django -->
                {{ form.username }}
            </div>
            <div class="form-group">
                <label>Contraseña</label>
                <!-- Renderizamos solo el campo de contraseña de Django -->
                {{ form.password }}
            </div>
            <button type="submit" class="btn-submit">Entrar al Sistema</button>
        </form>
    </div>

    <!-- Limpiamos las clases feas que Django le pone a los inputs por defecto -->
    <script>
        document.querySelectorAll('input').forEach(input => {
            input.classList.remove('form-control');
        });
    </script>
</body>
</html>
